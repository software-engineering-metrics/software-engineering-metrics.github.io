name: Deploy to GitHub Pages

# This repo holds no site source of its own any more. The source lives at
# software-engineering-metrics.github.io/ inside the software-engineering-metrics
# monorepo (https://github.com/software-engineering-metrics/software-engineering-metrics),
# because publishing at this repo's own root domain requires the deploy to
# run as a workflow of THIS repo. That monorepo's own CI sends the
# monorepo-updated repository_dispatch below after every push to its main
# branch; workflow_dispatch is the manual fallback.

on:
  repository_dispatch:
    types: [monorepo-updated]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the software-engineering-metrics monorepo
        uses: actions/checkout@v4
        with:
          repository: software-engineering-metrics/software-engineering-metrics
          ref: ${{ github.event.client_payload.ref || 'main' }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.0.8

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: software-engineering-metrics.github.io/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: software-engineering-metrics.github.io
        run: pnpm install --frozen-lockfile

      - name: Check
        working-directory: software-engineering-metrics.github.io
        run: pnpm run check

      - name: Build site
        working-directory: software-engineering-metrics.github.io
        run: pnpm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: software-engineering-metrics.github.io/build/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/assets/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      Runs before first paint so a returning visitor's stored theme/text-size
      (set by @lilydesignsystem/svelte-theme-picker and -text-size-picker in
      +layout.svelte) applies immediately, with no flash of the data-theme="light"
      default above. Both themes are preloaded below (not just the active one)
      per ThemePicker's "zero-flicker switching" guidance, so this only ever
      flips an attribute, never triggers a stylesheet fetch.
    -->
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('lily-theme');
          if (theme === 'dark' || theme === 'light') document.documentElement.setAttribute('data-theme', theme);
          var textSize = localStorage.getItem('lily-text-size');
          if (textSize) document.documentElement.setAttribute('data-text-size', textSize);
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="%sveltekit.assets%/assets/themes/light.css" />
    <link rel="stylesheet" href="%sveltekit.assets%/assets/themes/dark.css" />
    <link rel="stylesheet" href="%sveltekit.assets%/assets/style.css" />
    %sveltekit.head%
    <script src="%sveltekit.assets%/assets/picker-popup.js" defer></script>
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
